<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#124f96">
<title>WORKS 連続撮影テスト</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#172538;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#1558a5;color:white;padding:16px 18px}.top small{opacity:.8}.top h1{font-size:21px;margin:5px 0}main{max-width:760px;margin:auto;padding:14px}.panel{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #17324a12}p{line-height:1.6}.muted{color:#5d6e83;font-size:13px}button{border:0;border-radius:10px;background:#1558a5;color:white;font-weight:700;font-size:16px;padding:12px 15px;min-height:46px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.secondary{background:#e7eff9;color:#144c87}.danger{background:#fff1f1;color:#b22222}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls>*{flex:1}.camera{background:#111;border-radius:12px;overflow:hidden;position:relative}video{display:block;width:100%;max-height:65vh;object-fit:contain;background:#000}.placeholder{padding:65px 10px;color:#cfd5dd;text-align:center}.shootbar{display:flex;justify-content:space-around;align-items:center;background:#161b23;padding:13px}.shoot{width:72px;height:72px;border:5px solid white;background:white;border-radius:50%;box-shadow:inset 0 0 0 3px #353535}.count{font-weight:700;font-size:20px}.status{background:#eef5ff;border-radius:10px;padding:10px 12px;font-size:14px}.status.error{background:#fff0f0;color:#a11}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.item{position:relative;background:#e9edf2;border-radius:10px;overflow:hidden}.item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.item .foot{display:flex;align-items:center;justify-content:space-between;padding:7px}.item button{font-size:13px;padding:7px 11px;min-height:34px}.hide{display:none!important}dialog{border:0;border-radius:12px;padding:10px;width:95vw;max-width:850px;background:#111;color:white}dialog::backdrop{background:#000c}dialog img{display:block;max-height:75vh;max-width:100%;margin:10px auto;object-fit:contain}.dialogbar{display:flex;justify-content:space-between;align-items:center;gap:8px}footer{font-size:12px;color:#667;margin:15px 0 25px}
</style></head>
<body>
<header class="top"><small>WORKS / SERVICE · 撮影機能検証 v0.1</small><h1>連続撮影テスト</h1></header>
<main>
<section class="panel"><strong>使い方</strong><p class="muted">「カメラを起動」→シャッターを連続タップ→「撮影終了」。撮影後にカメラが閉じないか、画質や動作を確認してください。最大50枚。</p><div id="status" class="status" role="status">準備完了。カメラを起動してください。</div></section>
<section class="panel"><div class="camera"><div id="placeholder" class="placeholder">📷 カメラ未起動</div><video id="video" autoplay muted playsinline class="hide"></video><div id="shootbar" class="shootbar hide"><span style="color:white">撮影 <span id="during">0</span>/50</span><button id="shoot" class="shoot" aria-label="シャッター"></button><button id="stop" class="secondary">終了</button></div></div><div class="controls" style="margin-top:12px"><button id="start">📷 カメラを起動</button><button id="switch" class="secondary hide">カメラ切替</button></div></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><strong>撮影結果</strong><span id="count" class="count">0 / 50枚</span></div><p class="muted">画像は長辺2400px以内・JPEG品質88%で保存（端末内のみ）。プレビューは必要なときだけ表示。</p><div class="controls"><button id="preview" class="secondary">写真を確認</button><button id="clear" class="danger">すべて削除</button></div><div id="gallery" class="hide"><div id="grid"></div></div><p id="stats" class="muted"></p></section>
<footer>このテスト版は写真をサーバーへ送信しません。ページの再読み込み・終了で撮影写真は消えます。実際の返却伝票や顧客情報を使わず、テスト用の被写体でお試しください。</footer>
</main>
<dialog id="lightbox"><div class="dialogbar"><span id="caption"></span><button id="close" class="secondary">閉じる</button></div><img id="large" alt="選択写真の拡大"><div class="controls"><button id="save" class="secondary">この写真を端末に保存</button></div></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
let stream=null, facing='environment', shots=[], busy=false, galleryOpen=false, activeIndex=-1;
const status=(message,error=false)=>{$('status').textContent=message;$('status').className='status'+(error?' error':'')};
const update=()=>{$('count').textContent=shots.length+' / 50枚';$('during').textContent=shots.length;$('shoot').disabled=shots.length>=50||busy;$('clear').disabled=shots.length===0;$('preview').disabled=shots.length===0;$('stats').textContent=shots.length?'合計 '+(shots.reduce((a,x)=>a+x.blob.size,0)/1048576).toFixed(1)+' MB（圧縮後）':'';if(galleryOpen)renderGallery()};
const stopCamera=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('video').classList.add('hide');$('shootbar').classList.add('hide');$('placeholder').classList.remove('hide');$('start').classList.remove('hide');$('switch').classList.add('hide')};
async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){status('このブラウザではカメラを利用できません。HTTPSで開いてください。',true);return}stopCamera();try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:3840},height:{ideal:2160}}});const v=$('video');v.srcObject=stream;await v.play();$('placeholder').classList.add('hide');v.classList.remove('hide');$('shootbar').classList.remove('hide');$('start').classList.add('hide');$('switch').classList.remove('hide');status('カメラ起動中。シャッターを連続して押せます。')}catch(e){stopCamera();status('カメラを起動できません: '+(e.name||'不明')+'。ブラウザのカメラ許可を確認してください。',true)}}
async function capture(){if(!stream||busy||shots.length>=50)return;busy=true;update();try{const v=$('video'),w=v.videoWidth,h=v.videoHeight;if(!w||!h)throw Error('映像が準備できていません');const scale=Math.min(1,2400/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);c.getContext('2d',{alpha:false}).drawImage(v,0,0,c.width,c.height);const blob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('JPEG変換失敗')),'image/jpeg',.88));shots.push({blob,url:URL.createObjectURL(blob),w:c.width,h:c.height});c.width=0;c.height=0;status(shots.length+'枚撮影済み。続けて撮影できます。')}catch(e){status('撮影エラー: '+e.message,true)}finally{busy=false;update()}}
function renderGallery(){const grid=$('grid');grid.replaceChildren();shots.forEach((s,i)=>{const item=document.createElement('div');item.className='item';const img=document.createElement('img');img.src=s.url;img.alt='写真'+(i+1);img.loading='lazy';img.onclick=()=>openPhoto(i);const foot=document.createElement('div');foot.className='foot';const label=document.createElement('span');label.textContent='写真 '+(i+1);const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>{if(!confirm('写真 '+(i+1)+' を削除しますか？'))return;URL.revokeObjectURL(s.url);shots.splice(i,1);update();status('写真を削除しました')};foot.append(label,del);item.append(img,foot);grid.append(item)})}
function openPhoto(i){activeIndex=i;$('large').src=shots[i].url;$('caption').textContent='写真 '+(i+1)+' / '+shots.length+'（'+shots[i].w+'×'+shots[i].h+'）';$('lightbox').showModal()}
$('start').onclick=startCamera;$('shoot').onclick=capture;$('stop').onclick=()=>{stopCamera();status('撮影終了。必要なら写真を確認してください。')};$('switch').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera()};
$('preview').onclick=()=>{galleryOpen=!galleryOpen;$('gallery').classList.toggle('hide',!galleryOpen);$('preview').textContent=galleryOpen?'写真一覧を閉じる':'写真を確認';if(galleryOpen)renderGallery()};
$('clear').onclick=()=>{if(!confirm('撮影した写真をすべて削除しますか？'))return;shots.forEach(s=>URL.revokeObjectURL(s.url));shots=[];update();status('すべて削除しました')};
$('close').onclick=()=>$('lightbox').close();$('lightbox').addEventListener('close',()=>{$('large').removeAttribute('src');activeIndex=-1});
$('save').onclick=()=>{if(activeIndex<0)return;const a=document.createElement('a');a.href=shots[activeIndex].url;a.download='works-camera-test-'+String(activeIndex+1).padStart(2,'0')+'.jpg';a.click()};
window.addEventListener('pagehide',()=>{stopCamera()});update();
})();
</script></body></html>
