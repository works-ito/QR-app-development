<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>預かり品管理｜開発版</title>
<link rel="stylesheet" href="./styles.css?v=16">
<style>
body{background:var(--background);color:var(--ink)}
.app{max-width:430px;min-height:100dvh;padding: max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}
.app>a{display:inline-block;color:var(--blue-dark);font-size:14px;font-weight:700;margin:8px 0 12px;text-decoration:none}
h1{font-size:20px;font-weight:800;margin:4px 0 14px}
h2{font-size:23px;font-weight:900;line-height:1.3;margin:0 0 12px}
.card{background:var(--surface);border:1px solid #e1e6ee;border-radius:16px;padding:16px 14px 14px;margin:12px 0;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
button{font:inherit;min-height:48px;border:2px solid #bdd4f2;border-radius:12px;padding:9px;background:#f8fbff;color:#153c68;font-weight:900;touch-action:manipulation}
button:disabled{opacity:.48;cursor:not-allowed}
button[type=submit]{background:var(--blue);color:#fff;border-color:var(--blue);width:100%;margin-top:15px}
.secondary{background:#f5f6f8;color:#4c5668;border-color:var(--line)}
.grid button{min-height:66px;font-size:17px}
.hidden{display:none!important}
label{display:block;font-weight:800;font-size:14px;margin:13px 0 5px;color:var(--ink)}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:12px;background:#fff;border:1px solid #adb9ca;border-radius:10px;color:var(--ink)}
input[type=file]{padding:10px}input[type=number]{max-width:145px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.warning{background:var(--amber-pale);border:1px solid #ead29e;color:#865700;padding:11px;border-radius:10px;font-size:13px;line-height:1.5}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.item button{margin-top:8px}
.pill{font-size:12px;background:var(--blue-pale);color:#145aa8;padding:5px 9px;border:1px solid #c8ddfa;border-radius:999px;vertical-align:middle}
img.preview{width:96px;height:96px;object-fit:cover;border-radius:8px;margin:7px 6px 0 0}
</style></head><body><main class="app">
<a href="./index.html">← 在庫管理の初期画面へ戻る</a>
<h1>預かり品管理 <span class="pill">三郷・開発版</span></h1>
<p class="warning">画面動作確認用です。GAS・スプレッドシート・印刷機には未接続のため、保存や印刷はできません。</p>
<div class="grid"><button id="goIn">入庫</button><button id="goOut">出庫</button><button id="goList">一覧</button></div>
<section id="inPanel" class="card hidden"><h2>預かり品 入庫</h2>
<form id="inForm">
<label for="customer">顧客</label><select id="customer" required><option value="">選択してください</option><option value="__other">その他（入力）</option></select>
<div id="otherCustomerBox" class="hidden"><label for="otherCustomer">顧客名</label><input id="otherCustomer"></div>
<label for="site">現場名</label><input id="site" placeholder="不明なら空欄で登録可能">
<label for="item">預かり品名</label><input id="item" required placeholder="例：足場金物、養生材">
<label for="kind">保管形態</label><select id="kind"><option value="mesh">メッシュパレット</option><option value="other">その他（パレット外）</option></select>
<label for="qty">数量（整数）</label><div class="row"><input id="qty" type="number" min="1" step="1" value="1" required><span id="unitCaption">台</span></div>
<div id="unitBox" class="hidden"><label for="unit">単位</label><select id="unit"><option value="点">点</option><option value="本">本</option><option value="台">台</option><option value="式">式</option><option value="束">束</option></select></div>
<label for="photos">入庫写真（必須・最大6枚）</label><input id="photos" type="file" accept="image/*" capture="environment" multiple required><div id="preview"></div>
<label for="note">備考（任意）</label><textarea id="note" rows="2" placeholder="特徴や状態など"></textarea>
<button type="submit">入力内容を確認</button></form>
<div id="confirm" class="hidden"><h2>確認</h2><div id="confirmation"></div><p class="warning">現在は画面検証のみです。登録処理は接続後に有効化します。</p><button disabled>スプシ登録＋ラベル発行（未接続）</button><button class="secondary" id="backEdit" type="button">入力へ戻る</button></div>
</section>
<section id="outPanel" class="card hidden"><h2>預かり品 出庫</h2><p class="hint">顧客 → 現場 → 保管中の品物の順で選択します。</p>
<label for="outCustomer">顧客</label><select id="outCustomer"><option value="">保管中の顧客を読み込む</option></select>
<label for="outSite">現場</label><select id="outSite" disabled><option>顧客選択後に表示</option></select>
<div id="outItems" class="item">データ連携後、写真・品名・残数を表示します。</div>
<button disabled>出庫を登録（未接続）</button></section>
<section id="listPanel" class="card hidden"><h2>現在の預かり品</h2><p>顧客別・現場別の検索と写真確認を実装予定。データ連携後に表示します。</p></section>
</main><script src="./azukari.js?v=1"></script></body></html>
